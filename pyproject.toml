[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "karma"
version = "0.2.0"
description = "YAM and SO101 Quest teleoperation, MolmoAct2 inference and LeRobot v3 DAgger"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=1.26", "python-can>=4.3", "pyzmq>=25", "pyserial>=3.5",
  "json-numpy>=1.0", "requests>=2.31", "pillow>=10",
  "mujoco>=3.2", "websockets>=13", "fastapi>=0.115", "uvicorn[standard]>=0.30",
  "aiortc>=1.9", "av>=12", "opencv-python-headless>=4.10", "pyrealsense2>=2.55",
  "torch", "torchvision", "torchcodec",
  "lerobot[dataset]==0.6.1", "viser>=1.0", "yourdfpy>=0.0.56",
]

[project.optional-dependencies]
dev = ["hypothesis>=6", "pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
viz = []
# Compatibility with existing setup commands; runtime extras are now installed by default.
vr = []
cameras = []
inference = []
lerobot = []

[dependency-groups]
dev = ["karma[dev]"]

[tool.uv]
default-groups = []

[project.scripts]
karma = "openpi_control.cli:main"
karma-viz = "openpi_control.viz:main"
karma-relay = "vr_teleop_kit.relay.server:main"

[tool.scikit-build]
cmake.version = ">=3.22"
wheel.py-api = "py3"
wheel.packages = ["src/openpi_control", "src/vr_teleop_kit"]
wheel.install-dir = ""
sdist.include = [
  "native/**",
  "src/openpi_control/models/**",
  "src/openpi_control/arm_commands/**",
  "src/vr_teleop_kit/**",
  "licenses/**",
  "tests/**",
  "scripts/**",
]

[tool.scikit-build.cmake.define]
OPENPI_CONTROL_BUILD_NATIVE = "ON"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# The robot workstation records datasets and calls a remote GPU model server.
# CPU wheels avoid installing CUDA libraries solely for LeRobot's dataset API.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
torchcodec = { index = "pytorch-cpu" }
