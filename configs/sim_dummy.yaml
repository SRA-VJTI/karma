version: "1"

session:
  save_root: recordings
  auto_record_duration: 10.0

nodes:
  - type: AgentNode
    name: leader_left
    agent_class: karma.agents.teleoperation.dummy_agent:DummyAgent
    agent_kwargs:
      arm: left
      target_std: 0.3
      pose_interval: 1.0
    loop_mode: flat_out
    publish_freq: 200.0

  - type: AgentNode
    name: leader_right
    agent_class: karma.agents.teleoperation.dummy_agent:DummyAgent
    agent_kwargs:
      arm: right
      target_std: 0.3
      pose_interval: 1.0
    loop_mode: flat_out
    publish_freq: 200.0

  - type: XdofSimNode
    name: sim
    scene: hybrid
    task: bottles
    physics_dt: 0.0001
    control_decimation: 17
    camera_fps: 30.0
    viser_port: 8765
    vr_port: 8012
    cmd_topics:
      left: leader_left/joint_pos
      right: leader_right/joint_pos
